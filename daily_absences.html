<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Absences — Mizzentop</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a2744;
      --cream: #f7f3ec;
      --muted: #6b7280;
      --white: #ffffff;
      --border: #e5e1da;
      --light-bg: #f0ece4;
      --green: #2e7d32;
      --red: #c0392b;
      --gold: #b8860b;
      --orange: #ea580c;
      --purple: #7c3aed;
    }
    html, body { min-height: 100vh; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--navy); }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: var(--navy); color: var(--white);
    }
    .topbar a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; font-weight: 500; }
    .topbar a:hover { color: var(--white); }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; }

    .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px 80px; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; margin-bottom: 6px; }
    .page-header p { color: var(--muted); font-size: 14px; }

    .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted);
    }
    .control-group input[type=date] {
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--white); color: var(--navy);
    }
    .controls-spacer { flex: 1; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .btn-secondary { background: var(--white); color: var(--navy); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--light-bg); }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .pill {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--white); color: var(--navy); font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .pill .n { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; margin-left: 4px; }
    .pill.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .pill.active .n { color: rgba(255,255,255,0.7); }

    .summary-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; font-weight: 500; }
    .summary-line strong { color: var(--navy); font-weight: 600; }

    .table-wrap { background: var(--white); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--light-bg); color: var(--navy);
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafaf6; }
    td.name { font-weight: 600; }
    td.grade { font-size: 13px; color: var(--muted); font-weight: 500; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    /* Full-day absences: solid. Partial-day: outlined. */
    .badge.absent        { background: var(--red);  color: var(--white); }
    .badge.excused       { background: var(--gold); color: var(--white); }
    .badge.tardy         { background: var(--white); color: var(--orange); border: 1.5px solid var(--orange); }
    .badge.excused_tardy { background: var(--white); color: #b45309;       border: 1.5px solid #d97706; }
    .badge.ed            { background: var(--white); color: var(--purple); border: 1.5px solid var(--purple); }
    tr.partial td.name { font-weight: 500; }

    .empty-state, .loading-state { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 15px; }
    .empty-state.warn { color: #8a5a00; }

    .print-only { display: none; }

    @media (max-width: 720px) {
      .controls { flex-direction: column; align-items: stretch; }
      .controls-spacer { display: none; }
      .table-wrap { overflow-x: auto; }
    }

    @media print {
      @page { margin: 0.5in; }
      body { background: #fff; }
      .topbar, .controls, .pills, .no-print { display: none !important; }
      .print-only { display: block; }
      .container { max-width: none; padding: 0; }
      .page-header h1 { font-size: 22px; }
      .table-wrap { border: none; border-radius: 0; }
      thead th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 6px 8px; }
      tbody td { padding: 5px 8px; font-size: 12px; }
      tbody tr { page-break-inside: avoid; }
      tbody tr:hover { background: none; }
      .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/">← Home</a>
  <span class="topbar-title">Daily Absences</span>
  <span></span>
</div>

<div class="container">
  <div class="page-header">
    <h1>Daily Absences</h1>
    <p id="date-label">—</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="date-input">Date</label>
      <input type="date" id="date-input">
    </div>
    <button class="btn btn-secondary" id="today-btn" type="button">Today</button>
    <div class="controls-spacer"></div>
    <button class="btn btn-secondary" type="button" onclick="window.print()">Print</button>
  </div>

  <div class="pills" id="pills"></div>

  <div class="summary-line" id="summary"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Student</th><th>Grade</th><th>Homeroom</th><th>Status</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4"><div class="loading-state">Loading…</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let data = null;
let gradeFilter = 'all';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function gradeLabel(g) {
  g = String(g || '');
  if (!g) return 'No grade';
  return /^\d+$/.test(g) ? 'Grade ' + g : g;
}

function prettyDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US',
    { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

async function load(dateStr) {
  document.getElementById('rows').innerHTML =
    '<tr><td colspan="4"><div class="loading-state">Loading…</div></td></tr>';
  const qs = dateStr ? '?date=' + encodeURIComponent(dateStr) : '';
  try {
    const res = await fetch('/api/daily-absences' + qs);
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Could not load absences');
    data = json;
  } catch (e) {
    data = null;
    document.getElementById('rows').innerHTML =
      `<tr><td colspan="4"><div class="empty-state warn">${esc(e.message)}</div></td></tr>`;
    document.getElementById('summary').textContent = '';
    document.getElementById('pills').innerHTML = '';
    return;
  }
  document.getElementById('date-input').value = data.date;
  document.getElementById('date-label').textContent =
    prettyDate(data.date) + (data.date === data.today ? ' · Today' : '');
  // Drop a grade filter that no longer exists on the new date
  if (gradeFilter !== 'all' && !data.grades.some(g => g.grade === gradeFilter)) gradeFilter = 'all';
  render();
}

function render() {
  if (!data) return;

  // Pills: All + one per grade present
  let pills = `<button class="pill ${gradeFilter === 'all' ? 'active' : ''}" data-grade="all">All<span class="n">${data.total}</span></button>`;
  data.grades.forEach(g => {
    pills += `<button class="pill ${gradeFilter === g.grade ? 'active' : ''}" data-grade="${esc(g.grade)}">${esc(gradeLabel(g.grade))}<span class="n">${g.total}</span></button>`;
  });
  document.getElementById('pills').innerHTML = pills;

  const list = gradeFilter === 'all' ? data.students : data.students.filter(s => String(s.grade || '') === gradeFilter);
  const abs = list.filter(s => s.kind === 'absence').length;
  const part = list.length - abs;

  const scope = gradeFilter === 'all' ? '' : ` in ${esc(gradeLabel(gradeFilter))}`;
  document.getElementById('summary').innerHTML =
    `<strong>${list.length}</strong> student${list.length === 1 ? '' : 's'}${scope}: ` +
    `<strong>${abs}</strong> absent · <strong>${part}</strong> tardy / early dismissal` +
    `<span class="print-only">${esc(prettyDate(data.date))}${gradeFilter === 'all' ? '' : ' · ' + esc(gradeLabel(gradeFilter))}</span>`;

  const tbody = document.getElementById('rows');
  if (!data.records_on_date) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state warn">No attendance has been recorded for this date yet.</div></td></tr>`;
    return;
  }
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">No absences, tardies or early dismissals recorded.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(s => `
    <tr class="${s.kind}">
      <td class="name">${esc(s.last_name)}, ${esc(s.first_name)}</td>
      <td class="grade">${esc(s.grade)}</td>
      <td>${esc(s.homeroom) || '<span style="color:var(--muted)">—</span>'}</td>
      <td><span class="badge ${esc(s.status)}">${esc(s.status_label)}</span></td>
    </tr>`).join('');
}

document.getElementById('pills').addEventListener('click', e => {
  const btn = e.target.closest('.pill');
  if (!btn) return;
  gradeFilter = btn.dataset.grade;
  render();
});
document.getElementById('date-input').addEventListener('change', e => {
  if (e.target.value) load(e.target.value);
});
document.getElementById('today-btn').addEventListener('click', () => load(''));

load('');
</script>
<script src="/nav.js" defer></script>
</body>
</html>
