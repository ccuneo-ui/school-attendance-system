<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules — Mizzentop Day School</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--navy:#1a2744;--green:#2d5016;--gold:#c8992a;--cream:#f7f3ec;--muted:#6b7280;--light:#e8e2d9;--danger:#9b1c1c;
        --blue:#2563eb;--bluebg:#e6effb;--goldbg:#f6edd6;--wholebg:#eceff5;--freebg:#faf8f4;--fixedbg:#f3efe7;}
  html,body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--navy);min-height:100%;}
  .topnav{background:var(--navy);display:flex;align-items:center;gap:16px;padding:0 28px;height:56px;}
  .topnav .title{color:#fff;font-size:14px;font-weight:500;}
  .topnav .right{margin-left:auto;display:flex;gap:10px;}
  .topnav a{color:rgba(255,255,255,0.85);text-decoration:none;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,0.25);padding:7px 14px;border-radius:8px;}
  .topnav a:hover{background:rgba(255,255,255,0.1);}
  .page{max-width:1120px;margin:0 auto;padding:26px 22px 90px;}
  h1{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:2px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .pickbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;background:#fff;border:1px solid var(--light);border-radius:12px;padding:14px 16px;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  select,input[type=text]{padding:8px 11px;border:1px solid var(--light);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--navy);outline:none;min-width:200px;}
  select:focus,input:focus{border-color:var(--navy);}
  .seg{display:inline-flex;border:1px solid var(--light);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:#fff;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:8px 16px;cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:none;text-decoration:none;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--light);}
  .btn-primary{background:var(--navy);color:#fff;}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .head h2{font-family:'Playfair Display',serif;font-size:23px;}
  .head .who-meta{color:var(--muted);font-size:13.5px;}
  .stamp{color:var(--muted);font-size:12px;margin:2px 0 16px;}
  .gridwrap{overflow-x:auto;background:#fff;border:1px solid var(--light);border-radius:12px;padding:6px;margin-bottom:22px;}
  table.week{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px;}
  table.week th,table.week td{border:1px solid #eee6d9;padding:6px 8px;vertical-align:top;}
  table.week thead th{background:#faf7f1;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;}
  table.week td.per{background:#faf7f1;white-space:nowrap;width:118px;}
  table.week td.per .pn{font-weight:700;font-size:12px;}
  table.week td.per .pt{color:var(--muted);font-size:11px;}
  .cell{min-height:34px;}
  .cell .cname{font-weight:600;line-height:1.2;}
  .cell .cmeta{color:var(--muted);font-size:11px;margin-top:2px;}
  .cell.gold{background:var(--goldbg);} .cell.blue{background:var(--bluebg);} .cell.whole{background:var(--wholebg);}
  .cell.fixed{background:var(--fixedbg);color:#6a5a3a;font-style:italic;}
  .cell.free{background:var(--freebg);color:#7a7360;font-weight:600;font-size:11px;}
  .cell.off{background:#f1eee7;color:#b8b2a3;font-style:italic;font-size:11px;}
  .cell.ss{background:#e7f2ea;box-shadow:inset 3px 0 0 #2d7a3e;}
  .tag.ss{background:#cfe6d6;color:#215c30;}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:9px;text-transform:uppercase;letter-spacing:.03em;margin-left:5px;vertical-align:middle;}
  .tag.gold{background:rgba(200,153,42,.2);color:#7a5a10;} .tag.blue{background:#d5e6f9;color:#1b5faa;} .tag.whole{background:rgba(26,39,68,.12);color:var(--navy);}
  .classlist{background:#fff;border:1px solid var(--light);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
  .classlist h3{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:10px;}
  .clrow{padding:10px 0;border-top:1px solid #f3efe7;}
  .clrow:first-of-type{border-top:none;}
  .clrow .cl-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .clrow .cl-name{font-weight:600;font-size:14px;}
  .clrow .cl-meta{color:var(--muted);font-size:12.5px;}
  .roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .stud{font-size:12px;background:#f5f1e8;border:1px solid var(--light);border-radius:20px;padding:3px 10px;cursor:pointer;text-decoration:none;color:var(--navy);}
  .stud:hover{background:#eef2f8;border-color:#c9d4e6;}
  .note{font-size:12.5px;color:var(--muted);}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;}
  .backlink{font-size:12.5px;color:var(--blue);text-decoration:none;}
  @media print{.topnav,.pickbar,.noprint,.classlist{display:none;}.page{padding:0;}.gridwrap{overflow:visible;}table.week{min-width:0;}}
</style>
</head>
<body>
<nav class="topnav">
  <span class="title">Schedules</span>
  <div class="right"><a href="/my-classroom">My Classroom</a><a href="/reconcile">Class Check</a><a href="/">← Home</a></div>
</nav>
<div class="page">
  <h1>Schedules</h1>
  <div class="sub">Look up any student's or teacher's weekly schedule from the current master timetable. Read-only.</div>

  <div class="pickbar noprint">
    <div class="fld">
      <label>View</label>
      <div class="seg" id="seg">
        <button data-mode="teacher" onclick="setMode('teacher')">Teacher</button>
        <button data-mode="student" onclick="setMode('student')">Student</button>
      </div>
    </div>
    <div class="fld" id="pickWrap">
      <label id="pickLabel">Teacher</label>
      <select id="pick" onchange="onPick()"><option value="">Loading…</option></select>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-ghost" onclick="window.print()">Print / Save PDF</button>
  </div>

  <div id="out"><div class="empty">Loading the timetable…</div></div>
</div>

<script>
/* ============ constants (mirror the scheduler) ============ */
const DAYS=["Mon","Tue","Wed","Thu","Fri"];
const PERIODS=["P1","P2","P3","P4","P5","P6","P7","P8","P9"];
const PERIOD_TIMES={
  lower:{P1:"8:30–9:14",P2:"9:17–10:01",P3:"10:04–10:48",P4:"10:51–11:35",P5:"11:38–12:22",P6:"12:25–1:09",P7:"1:12–1:56",P8:"1:59–2:43",P9:"2:45–3:25"},
  g56:{P1:"8:25–9:09",P2:"9:12–9:56",P3:"9:59–10:43",P4:"10:46–11:30",P5:"11:33–12:22",P6:"12:25–1:09",P7:"1:12–1:56",P8:"1:59–2:43",P9:"2:45–3:25"},
  g78:{P1:"8:25–9:09",P2:"9:12–9:56",P3:"9:59–10:43",P4:"10:46–11:35",P5:"11:38–12:22",P6:"12:25–1:09",P7:"1:12–1:56",P8:"1:59–2:43",P9:"2:45–3:25"}
};
const G56=["5A","5B","5AB","6A","6B","6AB"], G78=["7A","7B","7C","7AB","8AB","8A","8B"];
const WED_FREE={day:"Wed",period:"P3"};
const P9_LABELS={Mon:"Extra Help / Student Council",Tue:"Advisory",Wed:"Extra Help",Thu:"Extra Help",Fri:"Extra Help"};
function bandOfGroup(g){ return G56.includes(g)?"g56":(G78.includes(g)?"g78":"lower"); }
function bandOfGrade(gr){ gr=String(gr); return (gr==="5"||gr==="6")?"g56":(gr==="7"||gr==="8")?"g78":"lower"; }
function p9Label(anyGroup,day){ return (G56.includes(anyGroup)||G78.includes(anyGroup))?(P9_LABELS[day]||"Extra Help"):"Homeroom"; }
function fixedDisplay(groupId,day,period,raw){
  if(day===WED_FREE.period&&false){}
  if(day===WED_FREE.day&&period===WED_FREE.period) return "Electives / Assembly";
  if(/lunch/i.test(raw||"")&&(G56.includes(groupId)||G78.includes(groupId))) return "Recess / Lunch";
  return raw;
}
const SUBJ_LABEL={MATH:"Math",ELA:"ELA",SCIENCE:"Science",SOCIAL:"Social Studies",SPANISH:"Spanish",ART:"Art",MUSIC:"Music",PE:"PE",STEAM:"STEAM",TECH:"Tech",LIBRARY:"Library",HEALTH:"Health"};
const SUBJ_CANON={math:"MATH",ela:"ELA",science:"SCIENCE","social studies":"SOCIAL",social:"SOCIAL",spanish:"SPANISH",art:"ART",music:"MUSIC",pe:"PE","p.e.":"PE",steam:"STEAM",tech:"TECH",library:"LIBRARY",health:"HEALTH"};
const SUBJ_PHRASES=Object.keys(SUBJ_CANON).sort((a,b)=>b.length-a.length);
const MATH_TEACHER_GRADES=new Set(["6","7","8"]);
const MATH_SECTION_NAME={"6A":"6th McLeod","6B":"6th Duthie","7A":"7th McLeod","7B":"7th Duthie","7C":"7th Alvarez","8A":"8th McLeod","8B":"8th Duthie"};
const GROUP_NAME_OVERRIDE={"7C":"7th Alvarez","8A":"8th McLeod","8B":"8th Duthie"};

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function gradeCanon(g){ if(g==null)return ''; g=String(g).trim().toLowerCase();
  if(g==='kindergarten'||g==='k')return 'K'; if(g==='jpk')return 'JPK'; if(g==='spk')return 'SPK';
  const m=g.match(/^(\d+)/); return m?m[1]:g.toUpperCase(); }
function schedSlot(cohort,part,subject,teacher){
  if(part==='AB')return 'WHOLE';
  if(subject==='MATH'&&MATH_TEACHER_GRADES.has(cohort))return 'T:'+teacher;
  if(part==='A')return 'GOLD'; if(part==='B')return 'BLUE'; if(part==='C')return 'WHITE'; return 'SOLO';
}
function parseSection(name){
  let n=(name||'').trim().replace(/^(JPK|SPK|Kindergarten|\d+(?:st|nd|rd|th)? Grade|\d+(?:st|nd|rd|th))\s+/i,'');
  const low=n.toLowerCase(); let subj=null,rest=n;
  for(const ph of SUBJ_PHRASES){ if(low.startsWith(ph)){ subj=SUBJ_CANON[ph]; rest=n.slice(ph.length).trim(); break; } }
  return {subject:subj,suffix:rest};
}
function classSlot(suffix){ const s=(suffix||'').trim().toLowerCase();
  if(s==='whole grade'||s==='whole')return 'WHOLE'; if(s==='gold')return 'GOLD'; if(s==='blue')return 'BLUE';
  if(s==='white')return 'WHITE'; if(s==='')return 'SOLO'; return 'T:'+suffix.trim(); }
function slotCss(slot){ if(slot==='GOLD')return 'gold'; if(slot==='BLUE')return 'blue'; if(slot==='WHOLE')return 'whole'; return ''; }
function slotTag(slot){ if(slot==='GOLD')return '<span class="tag gold">Gold</span>'; if(slot==='BLUE')return '<span class="tag blue">Blue</span>';
  if(slot==='WHOLE')return '<span class="tag whole">whole</span>'; return ''; }

/* ============ state ============ */
let SCHED=null, ROST=null;
let grpById={}, classKeyToSessions={}, teacherSessions={}, fixedByGroup={};
let studentsById={}, sectionsById={}, sectionsByStudent={}, teachersById={}, sectionsByTeacher={};
let ssByStudent={};   // student_id -> [{day,period,service_name,staff_name,room_name}] (in-session special services)
let ssByStaff={};     // staff_id -> [{day,period,service_name,student_name,student_grade,room_name}]
let MODE='teacher';

async function boot(){
  let sr,rr,ssr;
  try{ [sr,rr,ssr]=await Promise.all([
        fetch('/api/scheduler').then(r=>r.json()),
        fetch('/api/schedule/rosters').then(r=>r.json()),
        fetch('/api/special-services/sessions').then(r=>r.json()).catch(()=>({sessions:[]}))
      ]); }
  catch(e){ document.getElementById('out').innerHTML='<div class="empty">Could not load data. Make sure you are signed in.</div>'; return; }
  SCHED=(sr.data||{}); ROST=rr;
  ((ssr&&ssr.sessions)||[]).forEach(x=>{ if(!x.day||!x.period) return;
    if(x.student_id) (ssByStudent[x.student_id]=ssByStudent[x.student_id]||[]).push(x);
    if(x.staff_id) (ssByStaff[x.staff_id]=ssByStaff[x.staff_id]||[]).push(x); });
  const S=SCHED.S||{}, res=SCHED.result||{};
  (S.classes||[]).forEach(c=>grpById[c.id]=c);
  // fixed blocks by group
  (S.fixed||[]).forEach(f=>{ (fixedByGroup[f.groupId]=fixedByGroup[f.groupId]||[]).push(f); });
  // sessions -> class keys + teacher buckets
  const sess=res.sessions||[], asg=res.assign||[];
  sess.forEach((s,i)=>{
    const a=asg[i]||{}; if(!a.day||!a.period) return;
    const g=grpById[s.groupId]||{}; const cohort=gradeCanon(g.cohort!=null?g.cohort:s.groupId);
    const slot=schedSlot(cohort,g.part||'',s.subject,s.teacherId);
    const key=cohort+'|'+s.subject+'|'+slot;
    const pl={day:a.day,period:a.period,groupId:s.groupId,subject:s.subject,teacherId:s.teacherId,room:s.room,aide:s.aide,slot};
    (classKeyToSessions[key]=classKeyToSessions[key]||[]).push(pl);
    (teacherSessions[s.teacherId]=teacherSessions[s.teacherId]||[]).push(pl);
    if(s.aide) (teacherSessions['Belmonte']=teacherSessions['Belmonte']||[]).push(pl);
  });
  // rosters
  (ROST.students||[]).forEach(s=>{ studentsById[s.student_id]=s; });
  (ROST.sections||[]).forEach(sec=>{
    sectionsById[sec.section_id]=sec;
    if(sec.teacher_id) (sectionsByTeacher[sec.teacher_id]=sectionsByTeacher[sec.teacher_id]||[]).push(sec);
    (sec.student_ids||[]).forEach(sid=>{ (sectionsByStudent[sid]=sectionsByStudent[sid]||[]).push(sec); });
  });
  // Teacher picker = every ACTIVE staff member (classroom, homeroom, or support-only). Anyone can
  // have a schedule generated, even an empty one. Falls back to section teachers if the staff list is absent.
  if((ROST.staff||[]).length){
    (ROST.staff||[]).forEach(p=>{ teachersById[p.staff_id]={id:p.staff_id,name:(p.first_name+' '+p.last_name).trim(),last:p.last_name||''}; });
  } else {
    (ROST.sections||[]).forEach(sec=>{ if(sec.teacher_id && (!sec.teacher_status||sec.teacher_status==='active') && !teachersById[sec.teacher_id]) teachersById[sec.teacher_id]={id:sec.teacher_id,name:sec.teacher_name||('#'+sec.teacher_id),last:sec.teacher_last||''}; });
  }
  fillPicker();
  // route from URL
  const q=new URLSearchParams(location.search);
  if(q.get('student')){ MODE='student'; syncSeg(); document.getElementById('pick').value=q.get('student'); renderStudent(+q.get('student')); }
  else if(q.get('teacher')){ MODE='teacher'; syncSeg(); const tv=resolveTeacherParam(q.get('teacher')); document.getElementById('pick').value=tv||''; if(tv) renderTeacher(+tv); else document.getElementById('out').innerHTML='<div class="empty">That teacher was not found.</div>'; }
  else { syncSeg(); document.getElementById('out').innerHTML='<div class="empty">Pick a teacher or student above to see their week.</div>'; }
}

function resolveTeacherParam(v){ // accept staff_id or last name
  if(teachersById[v]) return v;
  const byLast=Object.values(teachersById).find(t=>String(t.last).toLowerCase()===String(v).toLowerCase());
  return byLast?String(byLast.id):'';
}
function syncSeg(){ document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===MODE)); document.getElementById('pickLabel').textContent = MODE==='teacher'?'Teacher':'Student'; }
function fillPicker(){
  const sel=document.getElementById('pick');
  if(MODE==='teacher'){
    const ts=Object.values(teachersById).sort((a,b)=>(a.last||a.name).localeCompare(b.last||b.name));
    sel.innerHTML='<option value="">Choose a teacher…</option>'+ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  } else {
    const ss=(ROST.students||[]).slice().sort((a,b)=>String(a.grade).localeCompare(String(b.grade),undefined,{numeric:true})||a.last_name.localeCompare(b.last_name));
    sel.innerHTML='<option value="">Choose a student…</option>'+ss.map(s=>`<option value="${s.student_id}">${esc(s.last_name+', '+s.first_name)} · Gr ${esc(s.grade||'—')}</option>`).join('');
  }
}
function setMode(m){ MODE=m; syncSeg(); fillPicker(); document.getElementById('out').innerHTML='<div class="empty">Pick a '+m+' above.</div>'; history.replaceState(null,'','/schedule'); }
function onPick(){ const v=document.getElementById('pick').value; if(!v){return;}
  if(MODE==='teacher'){ history.replaceState(null,'','/schedule?teacher='+v); renderTeacher(+v); }
  else { history.replaceState(null,'','/schedule?student='+v); renderStudent(+v); } }

/* ============ scheduler-parity helpers (read-only; mirror the scheduler) ============ */
const LUNCH_WIN=['P4','P5','P6'], MIN_DUTY=3, AIDE_ID='Belmonte';
const NO_DUTY_TEACHERS=new Set(['Keenan','Jordan']);
const ACAD=['P1','P2','P3','P4','P5','P6','P7','P8'];   // academic periods (P9 & HR are non-academic)
function staffs(s,tid){ return s.teacherId===tid || (tid===AIDE_ID && s.aide); }
function avail(tid){ const a=((SCHED.S||{}).availability||{})[tid]; if(a) return a; const w={}; DAYS.forEach(d=>w[d]=ACAD.slice()); return w; }
function lunchDisp(lbl){ if(lbl==='LUNCH DUTY')return'Recess / Lunch Duty'; if(lbl==='LUNCH NO DUTY')return'Recess / Lunch No Duty'; if(lbl==='LUNCH')return'Recess / Lunch'; return lbl; }
let LUNCH_PLAN=null;
function computeLunchPlan(){
  const S=SCHED.S||{}, res=SCHED.result||{}, sess=res.sessions||[], asg=res.assign||[];
  const lunchOverrides=SCHED.lunchOverrides||{}, teachers=S.teachers||[];
  const plan={}; teachers.forEach(t=>plan[t.id]={});
  const booked={}; teachers.forEach(t=>{ booked[t.id]={}; DAYS.forEach(d=>booked[t.id][d]=new Set()); });
  sess.forEach((s,i)=>{ const v=asg[i]; if(!v||!v.day)return; teachers.forEach(t=>{ if(staffs(s,t.id)) booked[t.id][v.day].add(v.period); }); });
  DAYS.forEach(day=>{
    const info={};
    teachers.forEach(t=>{
      const av=avail(t.id)[day]||[];
      const free=av.filter(p=>!booked[t.id][day].has(p) && !(day===WED_FREE.day&&p===WED_FREE.period));
      const winFree=LUNCH_WIN.filter(p=>free.includes(p));
      let base=winFree[0]; if(!base && free.length) base=free[0];
      const prepCount=free.length-(base?1:0);
      const eligible=t.id!==AIDE_ID && !NO_DUTY_TEACHERS.has(t.id) && prepCount>=2 && winFree.length>0;
      info[t.id]={free,winFree,base,prepCount,eligible};
    });
    const chosen={}; teachers.forEach(t=>chosen[t.id]=info[t.id].base);
    const dutyAt=p=>teachers.filter(t=>info[t.id].eligible && chosen[t.id]===p).length;
    ['P4','P5'].forEach(target=>{ let guard=0;
      while(dutyAt(target)<MIN_DUTY && guard++<60){
        const cand=teachers.find(t=>{ const it=info[t.id]; if(!it.eligible||chosen[t.id]===target||!it.winFree.includes(target))return false;
          const cur=chosen[t.id]; if((cur==='P4'||cur==='P5')&&dutyAt(cur)<=MIN_DUTY)return false; return true; });
        if(!cand)break; chosen[cand.id]=target;
      }});
    teachers.forEach(t=>{ const it=info[t.id]; let lunchP=chosen[t.id]; let dutyBool=it.eligible;
      const ov=lunchOverrides[t.id+'|'+day];
      if(ov){ if(ov.lunchP && it.free.includes(ov.lunchP)) lunchP=ov.lunchP; if(typeof ov.duty==='boolean') dutyBool=ov.duty; }
      let dutyLabel; if(t.id===AIDE_ID)dutyLabel='LUNCH'; else if(NO_DUTY_TEACHERS.has(t.id))dutyLabel='LUNCH NO DUTY'; else dutyLabel=dutyBool?'LUNCH DUTY':'LUNCH NO DUTY';
      plan[t.id][day]={free:it.free,winFree:it.winFree,lunchP,dutyLabel,prepLabel:(t.id===AIDE_ID)?'free':'PREP'};
    });
  });
  return plan;
}
function getLunchPlan(){ if(!LUNCH_PLAN)LUNCH_PLAN=computeLunchPlan(); return LUNCH_PLAN; }
function teacherDayInfo(tid){ const plan=getLunchPlan(); const info={};
  DAYS.forEach(d=>{ const pd=(plan[tid]||{})[d]; const m={}; if(pd){ pd.free.forEach(p=>{ m[p]=(p===pd.lunchP)?pd.dutyLabel:pd.prepLabel; }); } info[d]=m; }); return info; }
function lastToken(nm){ return String(nm||'').trim().split(/\s+/).slice(-1)[0]; }
function isSchedTeacher(tid){ return ((SCHED.S||{}).teachers||[]).some(t=>t.id===tid) || tid===AIDE_ID; }
// group this staff member is the homeroom teacher of (by last name), for non-subject teachers
function homeroomGroupFor(last){ return ((SCHED.S||{}).classes||[]).find(c=>c.hr && c.hr.split(/[^A-Za-z]+/).includes(last)); }

// A scheduler teacher's full week: classes + PREP + Recess/Lunch(±duty) + P9 + HR + Electives + off.
function buildTeacherCells(tid){
  const cells={}; const tinfo=teacherDayInfo(tid); const av=avail(tid);
  DAYS.forEach(d=>{
    const hk=tid+'|'+d+'|HR', he=(SCHED.homeroomEdits||{})[hk];
    cells[d+'|HR']={kind:'fixed',label:he||'Homeroom'};
    const dk=tid+'|'+d+'|DIS', de=(SCHED.homeroomEdits||{})[dk];
    cells[d+'|DIS']={kind:'fixed',label:de||'Homeroom'};
    PERIODS.forEach(p=>{
      const pl=(teacherSessions[tid]||[]).find(x=>x.day===d&&x.period===p);
      if(pl){ cells[d+'|'+p]={kind:'class',slot:pl.slot,name:classDisplay(pl.groupId,pl.subject)+(pl.aide?' *':''),meta:[SUBJ_LABEL[pl.subject]||pl.subject,pl.room||'']}; return; }
      if(p==='P9'){ cells[d+'|'+p]={kind:'fixed',label:(P9_LABELS[d]||'Extra Help')}; return; }
      if(d===WED_FREE.day&&p===WED_FREE.period){ cells[d+'|'+p]={kind:'fixed',label:'Electives / Assembly'}; return; }
      const lbl=tinfo[d]&&tinfo[d][p];
      if(lbl){ cells[d+'|'+p]=/LUNCH/.test(lbl)?{kind:'fixed',label:lunchDisp(lbl)}:{kind:'free',label:'PREP'}; return; }
      cells[d+'|'+p]=(av[d]||[]).includes(p)?{kind:'free',label:'PREP'}:{kind:'off',label:'off'};
    });
  });
  return cells;
}
// A class group's full week (for a homeroom/PreK teacher, or a student): specials + lunch + homeroom.
function buildGroupCells(gid){
  const cells={}; const res=SCHED.result||{}, sess=res.sessions||[], asg=res.assign||[];
  DAYS.forEach(d=>{
    cells[d+'|HR']={kind:'fixed',label:'Homeroom'};
    cells[d+'|DIS']={kind:'fixed',label:'Homeroom'};
    PERIODS.forEach(p=>{
      let found=null;
      for(let i=0;i<sess.length;i++){ const v=asg[i]; if(!v||v.day!==d||v.period!==p)continue; const s=sess[i];
        if(s.groupId===gid || (s.conflicts&&s.conflicts.includes(gid))){ found=s; break; } }
      if(found){ const gg=grpById[found.groupId]||{}; const slot=schedSlot(gradeCanon(gg.cohort!=null?gg.cohort:found.groupId),gg.part||'',found.subject,found.teacherId);
        cells[d+'|'+p]={kind:'class',slot,name:classDisplay(found.groupId,found.subject),meta:[SUBJ_LABEL[found.subject]||found.subject,found.teacherId||'',found.room||'']}; return; }
      if(p==='P9'){ cells[d+'|'+p]={kind:'fixed',label:(G56.includes(gid)||G78.includes(gid))?(P9_LABELS[d]||'Extra Help'):'Homeroom'}; return; }
      if(d===WED_FREE.day&&p===WED_FREE.period){ cells[d+'|'+p]={kind:'fixed',label:'Electives / Assembly'}; return; }
      const fx=(fixedByGroup[gid]||[]).find(f=>(f.day==='*'||f.day===d)&&f.period===p);
      if(fx){ cells[d+'|'+p]={kind:'fixed',label:fixedDisplay(gid,d,p,fx.label)}; return; }
      cells[d+'|'+p]={kind:'fixed',label:'Homeroom'};
    });
  });
  return cells;
}

/* ============ grid rendering ============ */
function blankGrid(){ const g={}; DAYS.forEach(d=>PERIODS.forEach(p=>g[d+'|'+p]=null)); return g; }
function cellHTML(c){
  if(!c) return '<td><div class="cell free"></div></td>';
  if(c.kind==='fixed') return `<td><div class="cell fixed">${esc(c.label||'')}</div></td>`;
  if(c.kind==='free')  return `<td><div class="cell free">${esc(c.label||'')}</div></td>`;
  if(c.kind==='off')   return `<td><div class="cell off">off</div></td>`;
  if(c.kind==='ss')    return `<td><div class="cell ss"><div class="cname">${esc(c.name)}<span class="tag ss">support</span></div><div class="cmeta">${(c.meta||[]).map(esc).filter(Boolean).join(' · ')}</div></div></td>`;
  return `<td><div class="cell ${slotCss(c.slot)}"><div class="cname">${esc(c.name)}${slotTag(c.slot)}</div><div class="cmeta">${(c.meta||[]).map(esc).filter(Boolean).join(' · ')}</div></div></td>`;
}
function renderGrid(cells, band){
  band=band||'g78';
  let h='<div class="gridwrap"><table class="week"><thead><tr><th>Period</th>'+DAYS.map(d=>`<th>${d}</th>`).join('')+'</tr></thead><tbody>';
  h+=`<tr><td class="per"><div class="pn">HR</div><div class="pt">8:05–8:20</div></td>`+DAYS.map(d=>cellHTML(cells[d+'|HR'])).join('')+'</tr>';
  PERIODS.forEach(p=>{
    const t=(PERIOD_TIMES[band]||PERIOD_TIMES.g78)[p]||'';
    h+=`<tr><td class="per"><div class="pn">${p}</div><div class="pt">${t}</div></td>`+DAYS.map(d=>cellHTML(cells[d+'|'+p])).join('')+'</tr>';
  });
  h+=`<tr><td class="per"><div class="pn">DIS</div><div class="pt">3:25–3:30</div></td>`+DAYS.map(d=>cellHTML(cells[d+'|DIS'])).join('')+'</tr>';
  h+='</tbody></table></div>';
  return h;
}

/* ============ teacher view ============ */
function classDisplay(groupId,subject){
  if(subject==='MATH'&&MATH_SECTION_NAME[groupId]) return MATH_SECTION_NAME[groupId];
  if(GROUP_NAME_OVERRIDE[groupId]) return GROUP_NAME_OVERRIDE[groupId];
  const g=grpById[groupId]; return g?g.name:groupId;
}
function renderTeacher(staffId){
  const t=teachersById[staffId]; if(!t){ document.getElementById('out').innerHTML='<div class="empty">Teacher not found.</div>'; return; }
  const last=t.last||'';
  let cells, band, subtitle, stamp;
  if(isSchedTeacher(last)){
    cells=buildTeacherCells(last);
    const sess=teacherSessions[last]||[];
    band=sess.some(pl=>bandOfGroup(pl.groupId)!=='lower')?(sess.some(pl=>bandOfGroup(pl.groupId)==='g78')?'g78':'g56'):'lower';
    subtitle='Teacher schedule';
    stamp=`${sess.length} class periods/week · ${ROST.school_year_start}-${String(ROST.school_year_start+1).slice(-2)}`;
  } else {
    const g=homeroomGroupFor(last);
    if(g){ cells=buildGroupCells(g.id); band=bandOfGroup(g.id);
      DAYS.forEach(d=>{ const he=(SCHED.homeroomEdits||{})[last+'|'+d+'|HR']; cells[d+'|HR']={kind:'fixed',label:he||'Homeroom'};
        const de=(SCHED.homeroomEdits||{})[last+'|'+d+'|DIS']; cells[d+'|DIS']={kind:'fixed',label:de||'Homeroom'}; });
      subtitle=`Homeroom teacher · ${esc(g.name||g.id)}`;
      stamp=`Homeroom-based day (this staff member doesn't teach a timetabled subject) · ${ROST.school_year_start}-${String(ROST.school_year_start+1).slice(-2)}`;
    } else {
      cells={}; band='g78';
      const mySecs=sectionsByTeacher[staffId]||[];
      const isHR=mySecs.some(s=>s.type==='homeroom'||s.type==='advisory');
      const he=SCHED.homeroomEdits||{};
      const hasEdit=DAYS.some(d=>he[last+'|'+d+'|HR']||he[last+'|'+d+'|DIS']);
      if(isHR){
        // Homeroom/advisory teacher with no timetabled class (e.g. an advisory teacher): show the
        // editable HR/DIS homeroom rows (Homeroom by default) that were set in the scheduler.
        DAYS.forEach(d=>{ cells[d+'|HR']={kind:'fixed',label:he[last+'|'+d+'|HR']||'Homeroom'};
          cells[d+'|DIS']={kind:'fixed',label:he[last+'|'+d+'|DIS']||'Homeroom'}; });
        const hrSec=mySecs.find(s=>s.type==='homeroom'||s.type==='advisory');
        subtitle='Homeroom teacher'+(hrSec&&hrSec.name?` · ${esc(hrSec.name)}`:'');
        stamp=`Homeroom periods (set in the scheduler) · ${ROST.school_year_start}-${String(ROST.school_year_start+1).slice(-2)}`;
      } else {
        // Any other active staff: an empty week, but honour HR/DIS labels if the scheduler set them.
        if(hasEdit) DAYS.forEach(d=>{ const h1=he[last+'|'+d+'|HR']; if(h1) cells[d+'|HR']={kind:'fixed',label:h1};
          const d1=he[last+'|'+d+'|DIS']; if(d1) cells[d+'|DIS']={kind:'fixed',label:d1}; });
        subtitle='Staff schedule';
        stamp=`No timetabled classes · ${ROST.school_year_start}-${String(ROST.school_year_start+1).slice(-2)}`;
      }
    }
  }
  // In-session special services this person PROVIDES appear on their schedule (student + service).
  const mySSp = ssByStaff[staffId]||[];
  const ssGroup={};
  mySSp.forEach(x=>{ (ssGroup[x.day+'|'+x.period]=ssGroup[x.day+'|'+x.period]||[]).push(x); });
  Object.keys(ssGroup).forEach(k=>{ const arr=ssGroup[k];
    const svcs=[...new Set(arr.map(x=>x.service_name||'Support'))].join(' / ');
    const studs=arr.map(x=>x.student_name||('Grade '+(x.student_grade||'?'))).join(', ');
    const rooms=[...new Set(arr.map(x=>x.room_name).filter(Boolean))].join(', ');
    cells[k]={kind:'ss', name:studs, meta:[svcs, rooms]};
  });
  let h=`<div class="head"><h2>${esc(t.name)}</h2><span class="who-meta">${subtitle}</span></div>`;
  h+=`<div class="stamp">${stamp}</div>`;
  h+=renderGrid(cells,band);
  // classes + rosters
  const secs=(sectionsByTeacher[staffId]||[]).slice().sort((a,b)=>(a.type>b.type?1:-1)||a.name.localeCompare(b.name));
  h+='<div class="classlist"><h3>Classes &amp; rosters</h3>';
  secs.forEach(sec=>{
    const studs=(sec.student_ids||[]).map(id=>studentsById[id]).filter(Boolean)
      .sort((a,b)=>a.last_name.localeCompare(b.last_name));
    h+=`<div class="clrow"><div class="cl-top"><span class="cl-name">${esc(sec.name)}</span>
      <span class="cl-meta">${esc((sec.type||'')+(sec.room_name?' · '+sec.room_name:''))} · ${studs.length} student${studs.length==1?'':'s'}</span></div>`;
    if(studs.length) h+='<div class="roster">'+studs.map(s=>`<a class="stud" href="/schedule?student=${s.student_id}">${esc(s.last_name+', '+s.first_name)}</a>`).join('')+'</div>';
    h+='</div>';
  });
  if(!secs.length && !mySSp.length) h+='<div class="note">No sections assigned on the Classes page.</div>';
  if(mySSp.length) h+=`<div class="clrow"><div class="cl-meta" style="margin-top:2px"><b>Special services provided:</b> ${mySSp.length} session${mySSp.length==1?'':'s'} — shown on the grid.</div></div>`;
  h+='</div>';
  document.getElementById('out').innerHTML=h;
}

/* ============ student view ============ */
function renderStudent(studentId){
  const st=studentsById[studentId]; if(!st){ document.getElementById('out').innerHTML='<div class="empty">Student not found.</div>'; return; }
  const grade=gradeCanon(st.grade);
  const secs=(sectionsByStudent[studentId]||[]);
  const cells=blankGrid();
  const myGroups=new Set();
  const placedSectionIds=new Set();
  const otherSections=[]; // enrolled but not on the timetable (support / homeroom / advisory)
  secs.forEach(sec=>{
    if(sec.type==='homeroom'||sec.type==='advisory'){ otherSections.push(sec); return; }
    const p=parseSection(sec.name); const g=gradeCanon(sec.grade);
    const key=(p.subject&&g)?(g+'|'+p.subject+'|'+classSlot(p.suffix)):null;
    const sessions=key?classKeyToSessions[key]:null;
    if(!sessions||!sessions.length){ otherSections.push(sec); return; }
    placedSectionIds.add(sec.section_id);
    sessions.forEach(pl=>{
      myGroups.add(pl.groupId);
      cells[pl.day+'|'+pl.period]={kind:'class',slot:pl.slot,name:sec.name,
        meta:[sec.teacher_last||sec.teacher_name||'', sec.room_name||'']};
    });
  });
  // HR homeroom (8:05–8:20) and Dismissal (3:25–3:30) for every student
  DAYS.forEach(d=>{ cells[d+'|HR']={kind:'fixed',label:'Homeroom'}; cells[d+'|DIS']={kind:'fixed',label:'Homeroom'}; });
  // overlay fixed blocks (lunch / electives) for the student's groups
  const groupsArr=[...myGroups];
  groupsArr.forEach(gid=>{
    (fixedByGroup[gid]||[]).forEach(f=>{
      const days = f.day==='*'?DAYS:[f.day];
      days.forEach(d=>{
        const cellKey=d+'|'+f.period;
        if(cells[cellKey]&&cells[cellKey].kind==='class') return; // don't overwrite a class
        cells[cellKey]={kind:'fixed',label:fixedDisplay(gid,d,f.period,f.label)};
      });
    });
  });
  // P9 block
  const anyG=groupsArr[0]||('grade'+grade);
  DAYS.forEach(d=>{ const k=d+'|P9'; if(!cells[k]) cells[k]={kind:'fixed',label:p9Label(groupsArr[0]||'',d)}; });
  // Wednesday electives if not already set
  const wkey=WED_FREE.day+'|'+WED_FREE.period;
  if(!cells[wkey]&&(grade==='5'||grade==='6'||grade==='7'||grade==='8')) cells[wkey]={kind:'fixed',label:'Electives / Assembly'};
  // In-session special services OVERRIDE whatever is on the regular schedule for that period/day.
  const mySS=ssByStudent[studentId]||[];
  mySS.forEach(x=>{ const staffLast=(x.staff_name||'').split(' ').slice(-1)[0];
    cells[x.day+'|'+x.period]={kind:'ss',name:x.service_name||'Special service',meta:[staffLast, x.room_name||'']}; });

  const band=bandOfGrade(grade);
  const color=st.cohort_color?(' · '+st.cohort_color.charAt(0).toUpperCase()+st.cohort_color.slice(1)):'';
  let h=`<div class="head"><h2>${esc(st.first_name+' '+st.last_name)}</h2><span class="who-meta">Grade ${esc(st.grade||'—')}${esc(color)} · student schedule</span></div>`;
  h+=`<div class="stamp">${placedSectionIds.size} scheduled classes · ${ROST.school_year_start}-${String(ROST.school_year_start+1).slice(-2)}</div>`;
  h+=renderGrid(cells,band);
  // class list
  h+='<div class="classlist"><h3>Classes</h3>';
  const placed=secs.filter(s=>placedSectionIds.has(s.section_id)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!placed.length) h+='<div class="note">No timetabled classes found for this student.</div>';
  placed.forEach(sec=>{ h+=`<div class="clrow"><div class="cl-top"><span class="cl-name">${esc(sec.name)}</span>
    <span class="cl-meta">${esc((sec.teacher_name||'No teacher')+(sec.room_name?' · '+sec.room_name:''))}</span></div></div>`; });
  if(mySS.length){ const svcs=[...new Set(mySS.map(x=>x.service_name||'Special service'))];
    h+=`<div class="clrow"><div class="cl-meta" style="margin-top:2px"><b>Special services:</b> ${svcs.map(esc).join(', ')} — shown on the grid, overriding the regular class that period.</div></div>`; }
  const support=otherSections.filter(s=>!(s.type==='homeroom')); // show advisory + support separately
  if(otherSections.length){
    h+='<div class="clrow"><div class="cl-meta" style="margin-top:2px">Also enrolled (not on the class timetable): '+
      otherSections.map(s=>esc(s.name)).join(', ')+'</div></div>';
  }
  h+='</div>';
  document.getElementById('out').innerHTML=h;
}

boot();
</script>
